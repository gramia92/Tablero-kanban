<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets/layout/images/{{layoutService.config().colorScheme === 'light' ? 'logo-dark' : 'logo-white'}}.svg" alt="Kanban logo" class="mb-5 w-6rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <form [formGroup]="form" (ngSubmit)="submit()">
                    <div class="text-center mb-5">
                        <div class="text-900 text-3xl font-medium mb-3">Crear cuenta</div>
                        <span class="text-600 font-medium">Regístrate para empezar a gestionar tus proyectos</span>
                    </div>

                    <div>
                        <label for="fullName" class="block text-900 text-xl font-medium mb-2">Nombre completo</label>
                        <input id="fullName" type="text" formControlName="fullName" placeholder="Nombre y apellido" pInputText class="w-full md:w-30rem mb-2" style="padding:1rem">
                        <small class="p-error block mb-3" *ngIf="form.get('fullName')?.touched && form.get('fullName')?.invalid">
                            El nombre es obligatorio.
                        </small>

                        <label for="email" class="block text-900 text-xl font-medium mb-2">Email</label>
                        <input id="email" type="text" formControlName="email" placeholder="Correo electrónico" pInputText class="w-full md:w-30rem mb-2" style="padding:1rem">
                        <small class="p-error block mb-3" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
                            Ingresa un correo electrónico válido.
                        </small>

                        <label for="password" class="block text-900 font-medium text-xl mb-2">Contraseña</label>
                        <p-password id="password" formControlName="password" placeholder="Mínimo 6 caracteres" [toggleMask]="true" styleClass="mb-2" inputStyleClass="w-full p-3 md:w-30rem"></p-password>
                        <small class="p-error block mb-3" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
                            La contraseña debe tener al menos 6 caracteres.
                        </small>

                        <label for="confirmPassword" class="block text-900 font-medium text-xl mb-2">Confirmar contraseña</label>
                        <p-password id="confirmPassword" formControlName="confirmPassword" placeholder="Repite la contraseña" [toggleMask]="true" [feedback]="false" styleClass="mb-2" inputStyleClass="w-full p-3 md:w-30rem"></p-password>
                        <small class="p-error block mb-3" *ngIf="form.get('confirmPassword')?.touched && form.errors?.['passwordMismatch']">
                            Las contraseñas no coinciden.
                        </small>

                        <div class="flex align-items-center justify-content-end mb-5">
                            <a class="font-medium no-underline ml-2 text-right cursor-pointer" style="color: var(--primary-color)" [routerLink]="['/auth/login']">¿Ya tienes cuenta? Inicia sesión</a>
                        </div>
                        <button pButton pRipple type="submit" label="Registrarme" [loading]="loading" class="w-full p-3 text-xl"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
